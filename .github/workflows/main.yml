name: Build Jetour APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip Jetour_Loan_Calculator_Android_RealBuild.zip -d android-project

      - name: Build APK
        working-directory: android-project/Jetour_Loan_Calculator_Android_RealBuild
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          cp android-project/Jetour_Loan_Calculator_Android_RealBuild/app/build/outputs/apk/debug/app-debug.apk Jetour-Loan-Calculator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jetour-Loan-Calculator-APK
          path: Jetour-Loan-Calculator.apk
